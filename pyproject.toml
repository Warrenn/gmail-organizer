[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gmail-organizer"
version = "0.1.0"
description = "Automatically label new Gmail messages on a schedule. Hybrid Apps Script + Python."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "google-api-python-client>=2.197",
    "google-auth>=2.50",
    "google-auth-oauthlib>=1.3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.4",
    "hypothesis>=6.141",
]

[project.scripts]
gmail-cleanup = "gmail_cleanup.__main__:main"

[tool.setuptools]
packages = ["gmail_cleanup"]
py-modules = ["classify_rules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
