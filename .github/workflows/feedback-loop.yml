name: feedback-loop

# Autonomous label-rule refinement. Detailed design: STRATEGY.md.
# Runtime brief Claude sees: .github/prompts/feedback-loop.md.
#
# ALL logic lives in scripts/feedback-loop.sh — the SAME script you can run
# locally (`aws sso login` then `scripts/feedback-loop.sh all`). This workflow
# only provides what a shell script cannot: OIDC→AWS auth, checkout, runtime
# provisioning, and the cross-job feedback.json artifact hop. The three jobs
# survive solely to preserve credential isolation:
#   scan    — has Gmail creds only; runs `feedback-loop.sh scan`
#   refine  — has Anthropic key only (NO Gmail/push creds); runs `... refine`
#   verify  — has neither; runs `... verify`
#
# DRY_RUN=false is set per job so CI performs real side effects; locally the
# script defaults DRY_RUN=true so runs are safe to repeat.
#
# AWS Parameter Store namespace: /cleanup-gmail/* (see docs/aws-bootstrap.md)

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:        # manual trigger for testing

# Least privilege: permissions are declared per-job, not workflow-wide.
permissions: {}

concurrency:
  group: feedback-loop
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: scan — has Gmail creds; produces feedback.json artifact
  # ---------------------------------------------------------------------------
  scan:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC into AWS to pull Gmail creds
      contents: read    # checkout
    # Skip until the user has populated repo variable AWS_ROLE_TO_ASSUME
    # per docs/aws-bootstrap.md. Until then the loop is dormant.
    if: vars.AWS_ROLE_TO_ASSUME != ''
    outputs:
      has_markers: ${{ steps.scan.outputs.has_markers }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false   # read-only job

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2 pyyaml

      # Pulls Gmail creds from SSM, scans for +X/-X markers, scrubs creds.
      - name: feedback-loop scan
        id: scan
        env:
          DRY_RUN: "false"
        run: scripts/feedback-loop.sh scan

      # feedback.json + the freshly-built regression corpus (tests/corpus.json)
      # so the refine job can verify -X survivors / corpus regression.
      - name: Upload feedback + corpus artifact
        if: steps.scan.outputs.has_markers == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: feedback
          path: |
            feedback.json
            tests/corpus.json
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 2: refine — Anthropic key only, Claude does the rule edits
  # ---------------------------------------------------------------------------
  refine:
    runs-on: ubuntu-latest
    needs: scan
    permissions:
      id-token: write       # OIDC into AWS to pull the Anthropic key
      contents: write       # push the refinement branch
      pull-requests: write  # open/label the PR
    if: needs.scan.outputs.has_markers == 'true'
    outputs:
      branch: ${{ steps.refine.outputs.branch }}
      pr_number: ${{ steps.refine.outputs.pr_number }}
    steps:
      # Containment: do NOT persist a push-capable token in git config. The
      # script's claude step runs with no ambient write credentials — it
      # authenticates the single push explicitly via GH_TOKEN.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download feedback.json artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: feedback

      - name: Set up Python (for test runs Claude triggers)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2 pyyaml pytest

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      # Pulls the Anthropic key from SSM, branches, runs Claude headless against
      # .github/prompts/feedback-loop.md, pushes, opens/updates the PR.
      - name: feedback-loop refine
        id: refine
        env:
          DRY_RUN: "false"
          GH_TOKEN: ${{ github.token }}
        run: scripts/feedback-loop.sh refine

  # ---------------------------------------------------------------------------
  # Job 3: verify — diff-allow-list, optional auto-merge
  # ---------------------------------------------------------------------------
  verify:
    runs-on: ubuntu-latest
    needs: refine
    permissions:
      contents: read        # checkout
      pull-requests: write  # label/comment/close/merge the PR
      issues: write         # file a loop-broken issue on escape
    if: needs.refine.outputs.pr_number
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ needs.refine.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false   # uses GH_TOKEN env for gh, not git creds

      # Rejects any file outside the allow-list (escape → close PR + issue),
      # then optionally auto-merges when repo var LOOP_AUTO_MERGE=true.
      - name: feedback-loop verify
        env:
          DRY_RUN: "false"
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.refine.outputs.pr_number }}
          BASE_REF: origin/main
          LOOP_AUTO_MERGE: ${{ vars.LOOP_AUTO_MERGE }}
        run: scripts/feedback-loop.sh verify

  # ---------------------------------------------------------------------------
  # Heartbeat: any job failure → open a loop-broken issue
  # ---------------------------------------------------------------------------
  heartbeat:
    runs-on: ubuntu-latest
    needs: [scan, refine, verify]
    permissions:
      contents: read  # checkout (to run the script)
      issues: write   # file a loop-broken issue on failure
    if: always() && (needs.scan.result == 'failure' || needs.refine.result == 'failure' || needs.verify.result == 'failure')
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: feedback-loop heartbeat
        env:
          DRY_RUN: "false"
          GH_TOKEN: ${{ github.token }}
          SCAN_RESULT: ${{ needs.scan.result }}
          REFINE_RESULT: ${{ needs.refine.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/feedback-loop.sh heartbeat
