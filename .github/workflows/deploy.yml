name: deploy

# Deploy regenerated Apps Script artifacts to Google after rule changes
# merge to main. Triggered only when files that affect Apps Script change.
#
# Fileless: pushes via the Apps Script REST API using an in-memory OAuth token
# from SSM (/cleanup-gmail/apps-script-token-json, scope script.projects). No
# clasp, no ~/.clasprc.json — no credential ever touches disk.
#
# Config: repo variable APPS_SCRIPT_ID = the target Apps Script project ID.

on:
  push:
    branches: [main]
    paths:
      - "apps-script/**"
      - "gmail_cleanup/rules.yaml"
  workflow_dispatch:

# Least privilege: permissions are declared per-job, not workflow-wide.
permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC into AWS to pull the Apps Script token from Parameter Store
      contents: read    # checkout
    # Skip until AWS bootstrap + APPS_SCRIPT_ID are set. Until then, deploy is
    # manual via `python -m gmail_cleanup deploy-apps-script` from the user's machine.
    if: vars.AWS_ROLE_TO_ASSUME != '' && vars.APPS_SCRIPT_ID != ''
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false   # job pushes to Google via the API, not to git

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2 pyyaml

      - name: Regenerate Apps Script from rules.yaml
        # Idempotent — if the generator output matches what's checked in,
        # this is a no-op. Defensive against rules.yaml drifting from the
        # checked-in Rules.gs / Classifier.gs.
        run: python -m gmail_cleanup generate-apps-script

      # Pulls the Apps Script token from SSM into the environment only (never a
      # file) and pushes apps-script/ via the Apps Script API.
      - name: Deploy Apps Script
        env:
          APPS_SCRIPT_ID: ${{ vars.APPS_SCRIPT_ID }}
        run: |
          set -euo pipefail
          APPS_SCRIPT_TOKEN_JSON=$(aws ssm get-parameter --name /cleanup-gmail/apps-script-token-json \
            --with-decryption --query Parameter.Value --output text)
          export APPS_SCRIPT_TOKEN_JSON
          python -m gmail_cleanup deploy-apps-script

  heartbeat:
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      issues: write   # file a loop-broken issue on failure
    if: always() && needs.deploy.result == 'failure'
    steps:
      - name: File loop-broken issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "deploy run ${{ github.run_id }} failed" \
            --label loop-broken \
            --body "Apps Script deploy failed after merge to main.\n\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
